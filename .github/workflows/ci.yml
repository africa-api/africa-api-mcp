name: MCP CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Verify package contents
        run: |
          set -euo pipefail
          test -f dist/index.js || { echo "dist/index.js missing after build"; exit 1; }
          npm pack --dry-run

      - name: Smoke test — server responds to initialize
        run: |
          set -euo pipefail
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          OUT="$(printf '%s\n' "$REQ" | timeout 25 node dist/index.js 2>/dev/null || true)"
          echo "$OUT"
          echo "$OUT" | grep -q '"result"' || { echo "MCP server did not return a result for initialize"; exit 1; }

      - name: Verify server.json version matches package.json
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if [ -f server.json ]; then
            SRV="$(node -p "require('./server.json').version || ''")"
            if [ -n "$SRV" ] && [ "$SRV" != "$PKG" ]; then
              echo "version mismatch: package.json=$PKG server.json=$SRV"
              exit 1
            fi
          fi
          echo "version ok: $PKG"
